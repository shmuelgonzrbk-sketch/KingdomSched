<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsignaTech — Admin</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px }
    @media(max-width:768px){ .admin-grid { grid-template-columns:1fr; } }
    .stat-card  { background:var(--navy); color:#fff; border-radius:10px; padding:20px; text-align:center; }
    .stat-num   { font-size:36px; font-weight:800; color:#0099cc; }
    .stat-label { font-size:12px; color:#94a3b8; margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
    .badge-admin{ background:#0099cc; color:#fff; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
    .badge-user { background:#e5e7eb; color:#6b7280; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
    .bosq-edit-row { display:flex; gap:6px; align-items:center; width:100%; }
    .bosq-edit-row input { flex:1; border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:13px; font-family:inherit; }
    .bosq-edit-row input:focus { outline:none; border-color:var(--navy); }
  </style>
</head>
<body>

<header class="topbar">
  <img src="/logo.png" style="width:32px;height:32px;border-radius:8px;margin-right:8px">
  <div class="topbar-brand">
    <span class="topbar-title">AsignaTech</span>
    <span class="topbar-sub">Panel de Administracion</span>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <a href="/" style="color:#94a3b8;font-size:13px;text-decoration:none">Volver a la app</a>
    <button onclick="logout()" style="background:#991b1b;color:#fff;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px">Salir</button>
  </div>
</header>

<main class="content" style="max-width:1000px">

  <div class="admin-grid">
    <div class="stat-card">
      <div class="stat-num" id="statUsuarios">--</div>
      <div class="stat-label">Usuarios registrados</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statBosquejos">--</div>
      <div class="stat-label">Bosquejos activos</div>
    </div>
  </div>

  <!-- USUARIOS -->
  <div class="card">
    <div class="card-title">Usuarios</div>
    <div class="bosq-table-wrap">
      <table class="bosq-table">
        <thead><tr>
          <th>Nombre</th><th>Email</th><th>Rol</th><th style="width:140px"></th>
        </tr></thead>
        <tbody id="usersList"></tbody>
      </table>
    </div>
  </div>

  <!-- BOSQUEJOS -->
  <div class="card">
    <div class="card-title">
      Bosquejos — Gestion Global
      <span id="bosqCount" style="font-weight:400;color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0;margin-left:6px"></span>
    </div>
    <div class="form-row" style="margin-bottom:12px">
      <input type="number" id="bNum" placeholder="N" style="width:70px">
      <input type="text" id="bTema" placeholder="Tema del bosquejo" style="flex:1">
      <button class="btn btn-primary" onclick="agregarBosquejo()">Agregar</button>
    </div>
    <div class="form-row" style="margin-bottom:12px">
      <input type="text" id="searchBosqAdmin" placeholder="Buscar bosquejo..." style="flex:1" oninput="filtrarBosquejos()">
    </div>
    <div class="bosq-table-wrap">
      <table class="bosq-table">
        <thead><tr>
          <th style="width:55px">N</th>
          <th>TEMA</th>
          <th style="width:130px"></th>
        </tr></thead>
        <tbody id="bosqList"></tbody>
      </table>
    </div>
  </div>

  <!-- DISCURSOS ESPECIALES -->
  <div class="card">
    <div class="card-title">Discursos Especiales <span style="font-weight:400;color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0">(sin numero de bosquejo)</span></div>
    <div class="form-row" style="margin-bottom:12px">
      <input type="text" id="dTema" placeholder="Tema del discurso especial" style="flex:1">
      <button class="btn btn-primary" onclick="agregarDiscurso()">Agregar</button>
    </div>
    <div class="bosq-table-wrap">
      <table class="bosq-table">
        <thead><tr><th>TEMA</th><th style="width:44px"></th></tr></thead>
        <tbody id="discursosList"></tbody>
      </table>
    </div>
  </div>

</main>

<div id="notif" style="display:none;position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15)"></div>

<script>
const SUPER_ADMIN = 'shmuelgonzrbk@gmail.com';
const API = '';
let allBosquejos  = [];
let currentAdmin  = null;

/* ── utils ──────────────────────────────────────── */
async function apiFetch(url, options = {}) {
  const res = await fetch(API + url, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options
  });
  if (res.status === 401 || res.status === 403) { window.location.href = '/'; return null; }
  if (!res.ok) throw await res.json();
  return res.json();
}

function notif(msg, tipo = 'ok') {
  const el = document.getElementById('notif');
  el.textContent      = msg;
  el.style.background = tipo === 'error' ? '#991b1b' : '#1a6b3a';
  el.style.display    = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function confirmarDiv(titulo, msg, onConfirm) {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
  div.innerHTML = `
    <div style="background:#fff;border-radius:10px;padding:28px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center">
      <div style="font-size:26px;margin-bottom:10px">&#9888;</div>
      <div style="font-size:15px;font-weight:800;color:#1a2744;margin-bottom:8px">${titulo}</div>
      <div style="font-size:13px;color:#6b7280;margin-bottom:20px">${msg}</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-secondary" id="cc">Cancelar</button>
        <button class="btn btn-danger" id="co">Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelector('#cc').addEventListener('click', () => document.body.removeChild(div));
  div.querySelector('#co').addEventListener('click', () => { document.body.removeChild(div); onConfirm(); });
}

async function logout() {
  await fetch('/auth/logout', { credentials: 'include' });
  window.location.href = '/';
}

/* ── cargar todo ────────────────────────────────── */
async function cargar() {
  const me = await apiFetch('/auth/me');
  if (!me || me.rol !== 'admin') { window.location.href = '/'; return; }
  currentAdmin = me;

  const [usuarios, bosquejos] = await Promise.all([
    apiFetch('/api/admin/usuarios'),
    apiFetch('/api/bosquejos')
  ]);

  allBosquejos = bosquejos;
  document.getElementById('statUsuarios').textContent  = usuarios.length;
  document.getElementById('statBosquejos').textContent = bosquejos.length;
  document.getElementById('bosqCount').textContent     = `(${bosquejos.length} registrados)`;

  // usuarios
  document.getElementById('usersList').innerHTML = usuarios.map(u => {
    let accion = '';
    if (u.email === SUPER_ADMIN) {
      accion = '<span style="font-size:11px;color:var(--muted)">Super admin</span>';
    } else if (currentAdmin.email === SUPER_ADMIN) {
      accion = `<button class="btn btn-sm ${u.rol==='admin'?'btn-danger':'btn-primary'}"
        onclick="confirmarRol('${u.id}','${u.nombre}','${u.rol==='admin'?'user':'admin'}')">
        ${u.rol==='admin'?'Quitar admin':'Hacer admin'}
      </button>`;
    } else {
      accion = '<span style="font-size:11px;color:var(--muted)">Sin permisos</span>';
    }
    return `<tr>
      <td style="display:flex;align-items:center;gap:8px">
        ${u.foto?`<img src="${u.foto}" style="width:28px;height:28px;border-radius:50%">`:''}
        ${u.nombre}
      </td>
      <td style="font-size:12px;color:var(--muted)">${u.email}</td>
      <td><span class="${u.rol==='admin'?'badge-admin':'badge-user'}">${u.rol}</span></td>
      <td>${accion}</td>
    </tr>`;
  }).join('');

  renderBosquejos(bosquejos);
  cargarDiscursos();
}

/* ── roles ──────────────────────────────────────── */
function confirmarRol(id, nombre, nuevoRol) {
  const msg = nuevoRol === 'admin'
    ? `Desea darle acceso de administrador a <b>${nombre}</b>?`
    : `Desea quitarle el rol de administrador a <b>${nombre}</b>?`;
  confirmarDiv('Cambiar rol', msg, () => cambiarRol(id, nuevoRol));
}

async function cambiarRol(id, nuevoRol) {
  await apiFetch(`/api/admin/usuarios/${id}/rol`, {
    method: 'PATCH', body: JSON.stringify({ rol: nuevoRol })
  });
  notif('Rol actualizado');
  cargar();
}

/* ── bosquejos ──────────────────────────────────── */
function filtrarBosquejos() {
  const q = document.getElementById('searchBosqAdmin').value.trim().toLowerCase();
  renderBosquejos(allBosquejos.filter(b => !q || String(b.id).includes(q) || b.tema.toLowerCase().includes(q)));
}

function renderBosquejos(list) {
  document.getElementById('bosqList').innerHTML = list.map(b => `
    <tr id="bosq-row-${b.id}">
      <td style="text-align:center"><b>${b.id}</b></td>
      <td>
        <div class="bosq-edit-row">
          <input type="text" id="bosq-inp-${b.id}"
            value="${b.tema.replace(/"/g,'&quot;')}"
            data-original="${b.tema.replace(/"/g,'&quot;')}"
            oninput="onBosqChange(${b.id},this)">
          <button class="btn btn-primary btn-sm" id="bosq-btn-${b.id}"
            style="display:none" onclick="confirmarActualizar(${b.id})">Guardar</button>
          <button class="del-btn" onclick="confirmarEliminar(${b.id})">x</button>
        </div>
      </td>
    </tr>`).join('');
}

function onBosqChange(id, input) {
  const btn = document.getElementById(`bosq-btn-${id}`);
  btn.style.display = input.value.trim() !== input.dataset.original ? 'inline-block' : 'none';
}

function confirmarActualizar(id) {
  const tema = document.getElementById(`bosq-inp-${id}`).value.trim();
  if (!tema) return;
  confirmarDiv('Actualizar bosquejo', `Seguro que desea actualizar el bosquejo <b>N°${id}</b>?`, () => editarBosquejo(id, tema));
}

async function editarBosquejo(id, tema) {
  await apiFetch(`/api/bosquejos/${id}`, { method:'PATCH', body: JSON.stringify({ tema }) });
  const b = allBosquejos.find(b => b.id === id);
  if (b) b.tema = tema;
  const inp = document.getElementById(`bosq-inp-${id}`);
  if (inp) { inp.dataset.original = tema; onBosqChange(id, inp); }
  notif('Bosquejo actualizado');
}

function confirmarEliminar(id) {
  confirmarDiv('Eliminar bosquejo',
    `Seguro que desea eliminar el bosquejo <b>N°${id}</b>? Esta accion no se puede deshacer.`,
    () => eliminarBosquejo(id));
}

async function eliminarBosquejo(id) {
  await apiFetch(`/api/bosquejos/${id}`, { method:'DELETE' });
  allBosquejos = allBosquejos.filter(b => b.id !== id);
  document.getElementById('statBosquejos').textContent = allBosquejos.length;
  document.getElementById('bosqCount').textContent     = `(${allBosquejos.length} registrados)`;
  filtrarBosquejos();
  notif('Bosquejo eliminado');
}

async function agregarBosquejo() {
  const num  = document.getElementById('bNum').value.trim();
  const tema = document.getElementById('bTema').value.trim();
  if (!num || !tema) { notif('Completa el numero y el tema', 'error'); return; }
  if (allBosquejos.find(b => b.id === Number(num))) { notif('Ese numero ya existe', 'error'); return; }
  await apiFetch('/api/bosquejos', { method:'POST', body: JSON.stringify({ id: num, tema }) });
  document.getElementById('bNum').value  = '';
  document.getElementById('bTema').value = '';
  notif('Bosquejo agregado');
  cargar();
}

/* ── discursos especiales ───────────────────────── */
async function cargarDiscursos() {
  const data = await apiFetch('/api/discursos');
  if (!data) return;
  document.getElementById('discursosList').innerHTML = data.length === 0
    ? '<tr><td colspan="2" style="padding:12px;color:var(--muted);text-align:center">Sin discursos especiales.</td></tr>'
    : data.map(d => `<tr>
        <td>${d.tema}</td>
        <td style="text-align:center">
          <button class="del-btn" onclick="confirmarEliminarDiscurso('${d.id}','${d.tema.replace(/'/g,"\\'")}')">x</button>
        </td>
      </tr>`).join('');
}

async function agregarDiscurso() {
  const inp  = document.getElementById('dTema');
  const tema = inp.value.trim();
  if (!tema) { notif('Escribe el tema del discurso', 'error'); return; }
  await apiFetch('/api/discursos', { method:'POST', body: JSON.stringify({ tema }) });
  inp.value = '';
  cargarDiscursos();
  notif('Discurso especial agregado');
}

function confirmarEliminarDiscurso(id, tema) {
  confirmarDiv('Eliminar discurso especial',
    `Seguro que desea eliminar <b>"${tema}"</b>?`,
    async () => {
      await apiFetch(`/api/discursos/${id}`, { method:'DELETE' });
      cargarDiscursos();
      notif('Eliminado');
    });
}

cargar();
</script>
</body>
</html>
